name: Finanzplanung
version: "0.28.0"
slug: finanz
description: Finanzplanung für Schweizer Haushalte – Vorsorge, Steuern, Wohneigentum, Vermögen, Versicherungen und Anlageberater
url: https://github.com/khu1985/finanz-ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
