# Vorlage für finanz.yaml – ohne persönliche Daten.
# Alle Beträge in CHF pro Jahr, Sätze in Prozent.

haushalt:
  name: Haushalt Muster
  zivilstand: verheiratet        # verheiratet | ledig
  kanton: ZH
  kinder:
    - name: Kind 1
      geburtsjahr: 2018
  bedarf_ruhestand: 96000        # gewünschtes Netto-Ausgabenbudget im Ruhestand (heutige Franken)
  entnahme_jahre: 25             # über wie viele Jahre Kapital (3a, PK-Kapital, Vermögen) verzehrt wird
  entnahme_rendite: 2.0          # Rendite auf dem Kapital während der Entnahme

personen:
  - id: p1
    name: Person 1
    geburtsdatum: "1985-06-15"
    geschlecht: m                # m | w
    pensionierung_alter: 65
    lohn_brutto: 110000
    sparen_monat: 0
    ahv:
      beitragsjahre_bisher: 18   # laut individuellem Konto (IK-Auszug)
      fehlende_jahre: 0
      einkommen_durchschnitt: 0  # 0 = aus Lohn schätzen
    pk:
      altersguthaben: 180000
      stand: "2026-01-01"
      sparbeitrag_jahr: 0        # AN + AG laut Vorsorgeausweis; 0 = BVG-Minimum
      zins: 1.25
      umwandlungssatz: 6.8
      einkauf_potenzial: 60000   # maximaler Einkauf laut Vorsorgeausweis
      einkauf_geplant: []        # z. B. [{jahr: 2027, betrag: 20000}]
      kapitalbezug_anteil: 0     # 0–100 % des Altersguthabens als Kapital
      ausweis_alterskapital: 0   # Prognose laut Vorsorgeausweis mit 65 (0 = selbst rechnen)
      ausweis_altersrente: 0     # Altersrente laut Vorsorgeausweis pro Jahr (0 = Umwandlungssatz)
    risiko:                      # Leistungen laut Vorsorgeausweis bzw. Policen, CHF pro Jahr
      iv_rente_pk: 0
      iv_kinderrente_pk: 0
      iv_rente_extern: 0
      partnerrente_pk: 0         # Ehegatten- bzw. Lebenspartnerrente
      waisenrente_pk: 0
      todesfallkapital_pk: 0
      todesfallkapital_extern: 0
      partner_bei_pk_gemeldet: false   # nur bei Konkubinat relevant
    saeule3a:
      guthaben: 45000
      beitrag_jahr: 7258
      rendite: 3.0
      konten: 3                  # für gestaffelten Bezug
  - id: p2
    name: Person 2
    geburtsdatum: "1987-03-02"
    geschlecht: w
    pensionierung_alter: 65
    lohn_brutto: 70000
    sparen_monat: 0
    ahv:
      beitragsjahre_bisher: 16
      fehlende_jahre: 0
      einkommen_durchschnitt: 0
    pk:
      altersguthaben: 90000
      stand: "2026-01-01"
      sparbeitrag_jahr: 0
      zins: 1.25
      umwandlungssatz: 6.8
      einkauf_potenzial: 40000
      einkauf_geplant: []
      kapitalbezug_anteil: 0
      ausweis_alterskapital: 0
      ausweis_altersrente: 0
    risiko:
      iv_rente_pk: 0
      iv_kinderrente_pk: 0
      iv_rente_extern: 0
      partnerrente_pk: 0
      waisenrente_pk: 0
      todesfallkapital_pk: 0
      todesfallkapital_extern: 0
      partner_bei_pk_gemeldet: false
    saeule3a:
      guthaben: 30000
      beitrag_jahr: 7258
      rendite: 3.0
      konten: 2

steuern:
  # Aus der letzten Steuerveranlagung bzw. Steuererklärung übernehmen.
  # Verheiratete: die Werte unten gelten für den Haushalt.
  # Nicht verheiratet (Konkubinat): unter «personen» je eine Steuererklärung erfassen, z. B.
  #   personen:
  #     - {person: Person 1, steuerbar_bund: 150000, steuerbar_kanton: 148000,
  #        steuer_kanton_gemeinde: 24000, grenzsteuersatz_kanton: 26, kinder: 1}
  # «kinder» = Kinder, für die diese Person den Kinderabzug / Elterntarif erhält.
  personen: []
  steuerbar_bund: 140000
  steuerbar_kanton: 145000
  steuer_kanton_gemeinde: 16000   # Staats- und Gemeindesteuer (inkl. Kirche) laut Rechnung
  grenzsteuersatz_kanton: 22      # Kanton + Gemeinde, mit dem Steuerrechner des Kantons ermitteln
  # Kapitalleistungen (PK, 3a): effektiver Satz Kanton + Gemeinde je Bezugsbetrag (Schätzung –
  # mit dem kantonalen Rechner ersetzen). Linear interpoliert.
  # Kanton bei gemeinsamer Besteuerung (Vergleich Heirat): Splitting-Divisor (2.0 = Vollsplitting) und Zusatzabzug
  ehe_splitting_divisor: 2.0
  ehe_abzug_kanton: 0
  kapitalbezug_kanton:
    - [0, 2.0]
    - [100000, 3.0]
    - [250000, 4.5]
    - [500000, 6.0]
    - [1000000, 7.5]

wohnen:
  aktiv: false
  kaufpreis: 1200000
  eigenmittel: 260000
  davon_pk_vorbezug: 0
  hypothek_zins: 1.8
  eigenmietwert: 26000
  schuldzinsen_abzug: true
  unterhalt_pauschal: 1.0          # % des Kaufpreises pro Jahr (Unterhalt + Nebenkosten)
  mieteinnahmen_jahr: 0            # z. B. Einliegerwohnung; zählt zu 80 % für die Tragbarkeit
  hypothek_faellig: ""             # JJJJ-MM-TT, für das Amortisations-Szenario
  amortisation_ziel: 0             # gewünschte Amortisation bei Fälligkeit
  amortisation_max: 0
  reserve: 50000                   # Notreserve, die nicht amortisiert wird
  nicht_antasten: [krypto, immobilie, hypothek, kredit, vorsorge]   # Vermögensarten, die nicht in die Amortisation fliessen
  verpfaendet: []                  # indirekte Amortisation, z. B. [{name: 3a Mobiliar P1, guthaben: 40000, beitrag_monat: 625, rendite: 1.0}]
  steuer_bezug_verpfaendet: 0      # geschätzte Steuer beim Bezug der verpfändeten Vorsorge

erinnerungen:
  benachrichtigung: ""             # leer = aus; «persistent» = Meldung in HA; sonst Notify-Dienst, z. B. notify.mobile_app_iphone
  steuererklaerung_frist: ""       # leer = Frist des Wohnkantons (haushalt.kanton); sonst MM-TT laut Formular
  fristerstreckung: ""             # MM-TT, wenn eine Erstreckung gewährt wurde
  eigene: []                       # z. B. [{titel: Depot prüfen, datum: "06-30", wiederholung: jaehrlich, vorlauf: 14, text: ...}]

ki:
  aktiv: false                     # KI-Aufgabe (ai_task) von Home Assistant für Dokumente und Berater nutzen
  entity: ""                       # z. B. ai_task.openai_ai_task; leer = Standard-KI-Aufgabe

berater:
  # Freie Beschreibung eurer Situation und Ziele für die Anlageberater (bleibt im Home Assistant).
  situation: ""
  profile: []                      # leer = Standardprofile; eigene: [{id, name, anweisung}]

annahmen:
  lohnentwicklung: 0.0             # reale Lohnsteigerung pro Jahr bis zur Pensionierung
  rendite_vermoegen: 3.0

kennzahlen:
  # Stand 2026 (BSV). Werden alle zwei Jahre angepasst – bitte prüfen.
  jahr: 2026
  ahv_min: 1260
  ahv_max: 2520
  ahv_plafond_ehepaar: 150         # % der Maximalrente
  ahv_13_rente: true               # 13. AHV-Rente ab Dezember 2026
  ahv_vollbeitragsjahre: 44
  ahv_vorbezug_kuerzung: 6.8       # % pro Vorbezugsjahr
  bvg_eintrittsschwelle: 22680
  bvg_koordinationsabzug: 26460
  bvg_max_lohn: 90720
  bvg_min_koord_lohn: 3780
  bvg_mindestzins: 1.25
  bvg_umwandlungssatz: 6.8
  bvg_gutschriften: {25: 7, 35: 10, 45: 15, 55: 18}
  saeule3a_max: 7258
  saeule3a_max_ohne_pk: 36288
  # Direkte Bundessteuer, Tarif ab 2025: [Untergrenze, Satz in % für den Teil darüber]
  bund_tarif_verheiratet:
    - [29700, 1.0]
    - [53400, 2.0]
    - [61300, 3.0]
    - [79100, 4.0]
    - [94900, 5.0]
    - [108600, 6.0]
    - [120500, 7.0]
    - [130500, 8.0]
    - [138300, 9.0]
    - [144200, 10.0]
    - [148200, 11.0]
    - [150300, 12.0]
    - [152300, 13.0]
  bund_tarif_ledig:
    - [15200, 0.77]
    - [33200, 0.88]
    - [43500, 2.64]
    - [58000, 2.97]
    - [76100, 5.94]
    - [82000, 6.60]
    - [108800, 8.80]
    - [141500, 11.00]
    - [184900, 13.20]
  bund_hoechstsatz: 11.5
  # Abzüge Bund für den Vergleich verheiratet ↔ Konkubinat (Stand 2025, bitte jährlich prüfen)
  bund_verheiratetenabzug: 2800
  bund_zweiverdiener_satz: 50
  bund_zweiverdiener_min: 8600
  bund_zweiverdiener_max: 14100
  bund_versicherungsabzug_ehe: 3700
  bund_versicherungsabzug_einzel: 1800
  bund_elterntarif_kind: 263
  eigenmietwert_abschaffung: 2029
  tragbarkeit_zins: 5.0
  tragbarkeit_max: 33.3
  belehnung_max: 80
  zweite_hypothek_ab: 66.7
  amortisation_jahre: 15
